    <div class="container">
        <h1>Ingresso</h1>
        <form action="#" method="post">
            <div class="form-group">
                <label for="inome">Nome:</label>
                <input type="text" placeholder="Digite seu nome" id="inome" name="nome" required>
            </div>
            
            <div class="form-group">
                <label for="iemail">E-mail:</label>
                <input type="email" placeholder="Digite seu E-mail" id="iemail" name="email" required>
            </div>

            <div class="form-group">
                <label for="icpf">CPF:</label>
                <input type="number" placeholder="Digite seu CPF"id="icpf" name="cpf" required>
            </div>

            <div class="form-group">
                <label for="endereço">Endereço:</label>
                <input type="text" placeholder="Digite seu endereço" id="ien" name="endereço" required>
            </div>

            <div class="form-group3">
                <label for="endereço">Doença:</label>

                <div class="marcacao">
                    <input type="checkbox" name="endereço" id="icard">
                    <label for="icard" class="nomezinhos">Problemas Cardíacos</label>

                    <input type="checkbox" name="endereço" id="eres" required>
                    <label for="eres" class="nomezinhos">Problemas Respiratorios</label>
                </div>
                <div class="marcacao">
                    <input type="checkbox" name="endereço" id="cad" required>
                    <label for="cad" class="nomezinhos">Cadeirante</label>
                    
                    <input type="checkbox" name="endereço" id="not" required>
                    <label for="not" class="nomezinhos">Não</label>
                </div>
            
            </div>

            <div class="form-group3">
                <label for="endereço">Sexo:</label>

                <div class="marcacao">
                    <label for="msc" class="nomezinhos">Masculino</label>
                    <input type="radio" name="sex" id="msc" required>
                    <label for="fmn" class="nomezinhos" >Feminino</label>
                    <input type="radio" name="sex" id="fmn" required>
                </div>
            </div>

            <div class="form-group3">
                <label for="ipay">Forma de Pagamento:</label>
                <div>
                    <select name="pay" id="ipay">
                        <option value="0">Selecionar</option>
                        <option value="1">Cartão de Credito</option>
                        <option value="2">Cartão de Debito</option>
                        <option value="3">Pix</option>
                    </select>
                </div>
            </div>

            <div class="form-group2">
                <label for="itexto">Mensagem:</label>
                <textarea name="texto" id="itexto" placeholder="Digite sua mensagem" cols="38" rows="15"></textarea>
            </div>
            
            <div id="botoes">
                <button type="reset" id="limpa">Limpar</button>
                <button type="submit" id="envia" onclick="mensagem()" >Enviar</button>
                <input type="hidden" name="redirectTo">
            </div>
        </form>
    </div>
