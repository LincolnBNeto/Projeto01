    <section>
        <form action="cadastro.php" method="post" autocomplete="on">
            <fieldset>
                <legend>Dados pessoais</legend>
                <div>
                    <p class="nome">
                        <label for="inome">Nome:</label>
                        <input type="text" name="nome" id="inome" required autocomplete="name" maxlength="10" placeholder="Nome completo" required>
                    </p>
                    <p class="telefone">
                        <label for="itel">Telefone:</label>
                        <input type="tel" name="tel" id="itel" autocomplete="tel" required placeholder="Digite seu telefone">
                    </p>
                </div>
                <p class="email">
                    <label for="iemail">Email:</label>
                    <input type="email" name="email" id="iemail" autocomplete="email" required placeholder="Digite seu email">
                </p>
                <div class="radio">
                    <legend class="sexo">Sexo:</legend>
                    <p class="homem">
                        <input type="radio" name="size" id="size_1" value="small" />
                        <label for="size_1">Homem</label>
                    </p>
                    <p class="mulher">
                        <input type="radio" name="size" id="size_2" value="medium" />
                        <label for="size_2">Mulher</label>
                    </p>
                </div>
                <p class="mensagem">
                    <label for="imsg">Mensagem:</label> <br>
                    <textarea name="msg" id="imsg" cols="30" rows="10" placeholder="Digite uma mensagem"></textarea>
                </p>
            </fieldset>
            <p>
                <input class="enviar" type="submit" value="Enviar">
                <input class="limpar" type="reset" value="Limpar">
            </p>
        </form>
